name: CI

on:
  pull_request:

jobs:
  check:
    name: build, lint and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Install make (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install make -y

      - name: Build
        shell: bash
        run: make build

      - name: Lint
        shell: bash
        run: make lint

      - name: Test
        shell: bash
        run: make test
